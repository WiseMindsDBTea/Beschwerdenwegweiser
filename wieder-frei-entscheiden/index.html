<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Wieder frei entscheiden</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f6f3;color:#1d232b;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}.load{max-width:34rem;text-align:center;line-height:1.5}@media(prefers-color-scheme:dark){body{background:#111417;color:#eef2f4}}
</style>
</head>
<body>
<div class="load">Arbeitsheft wird geöffnet …</div>
<script>
(async()=>{
  try{
    const files=['data/part1.txt','data/part2.txt','data/part3.txt','data/part4.txt','data/part5.txt'];
    const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(f+' '+r.status);
      return r.text();
    })));
    const b64=parts.join('').replace(/\s/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="load"><strong>Die Seite konnte nicht geladen werden.</strong><br>Bitte neu laden oder mit einer aktuellen Version von Safari, Chrome oder Firefox öffnen.</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
